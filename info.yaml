# Tiny Tapeout project information
project:
  title:        "SPI-Controlled PWM Periphera"
  author:       "Nithipan Sivakanthan"
  discord:      ""
  description:  "SPI peripheral controlling output enables and PWM on 16 output pins"
  language:     "Verilog"
  clock_hz:     0

  tiles: "1x1"

  top_module:  "tt_um_example"

  source_files:
    - "project.v"
    - "pwm_peripheral.v"

pinout:
  pinout:
  # Inputs
  ui[0]: "SCLK"
  ui[1]: "COPI"
  ui[2]: "nCS"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "out0"
  uo[1]: "out1"
  uo[2]: "out2"
  uo[3]: "out3"
  uo[4]: "out4"
  uo[5]: "out5"
  uo[6]: "out6"
  uo[7]: "out7"

  # Bidirectional pins
  uio[0]: "out8"
  uio[1]: "out9"
  uio[2]: "out10"
  uio[3]: "out11"
  uio[4]: "out12"
  uio[5]: "out13"
  uio[6]: "out14"
  uio[7]: "out15"

# Do not change!
yaml_version: 6
